<svg viewBox="0 0 800 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#232F3E">
    CineMatch - AWS Cloud Architecture
  </text>
  
  <!-- Users -->
  <g id="users">
    <rect x="325" y="60" width="150" height="80" fill="#FF9900" stroke="#232F3E" stroke-width="2" rx="5"/>
    <text x="400" y="90" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Users</text>
    <text x="400" y="115" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">(Web Browser)</text>
  </g>
  
  <!-- Arrow to EC2 -->
  <line x1="400" y1="140" x2="400" y2="200" stroke="#232F3E" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="420" y="175" font-family="Arial, sans-serif" font-size="12" fill="#232F3E">HTTPS</text>
  
  <!-- EC2 Instance -->
  <g id="ec2">
    <rect x="250" y="200" width="300" height="200" fill="#FF9900" stroke="#232F3E" stroke-width="3" rx="5"/>
    <text x="400" y="230" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Amazon EC2</text>
    <text x="400" y="250" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">(t3.medium instance)</text>
    
    <!-- FastAPI -->
    <rect x="270" y="270" width="260" height="50" fill="white" stroke="#232F3E" stroke-width="1" rx="3"/>
    <text x="400" y="295" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#232F3E">FastAPI App</text>
    <text x="400" y="310" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">(Uvicorn - Port 8000)</text>
    
    <!-- Static Files -->
    <rect x="270" y="335" width="260" height="45" fill="white" stroke="#232F3E" stroke-width="1" rx="3"/>
    <text x="400" y="355" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#232F3E">Static Files</text>
    <text x="400" y="370" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">(Frontend)</text>
  </g>
  
  <!-- Arrows from EC2 to services -->
  <line x1="250" y1="300" x2="150" y2="520" stroke="#232F3E" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="400" x2="400" y2="520" stroke="#232F3E" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="550" y1="300" x2="650" y2="520" stroke="#232F3E" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- RDS -->
  <g id="rds">
    <rect x="50" y="520" width="200" height="140" fill="#3B48CC" stroke="#232F3E" stroke-width="2" rx="5"/>
    <text x="150" y="550" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Amazon RDS</text>
    <text x="150" y="570" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">(PostgreSQL)</text>
    <text x="150" y="600" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">• User data</text>
    <text x="150" y="620" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">• Ratings</text>
    <text x="150" y="640" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">• Preferences</text>
  </g>
  
  <!-- S3 -->
  <g id="s3">
    <rect x="300" y="520" width="200" height="140" fill="#569A31" stroke="#232F3E" stroke-width="2" rx="5"/>
    <text x="400" y="550" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">AWS S3</text>
    <text x="400" y="570" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Storage</text>
    <text x="400" y="600" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">• Data files</text>
    <text x="400" y="620" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">• ML Models</text>
    <text x="400" y="640" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">• Parquet files</text>
  </g>
  
  <!-- Secrets Manager -->
  <g id="secrets">
    <rect x="550" y="520" width="200" height="140" fill="#DD344C" stroke="#232F3E" stroke-width="2" rx="5"/>
    <text x="650" y="550" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Secrets Manager</text>
    <text x="650" y="600" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">• API keys</text>
    <text x="650" y="620" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">• DB credentials</text>
    <text x="650" y="640" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">• JWT secrets</text>
  </g>
  
  <!-- Arrow from S3 to CloudWatch -->
  <line x1="400" y1="660" x2="400" y2="730" stroke="#232F3E" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- CloudWatch -->
  <g id="cloudwatch">
    <rect x="250" y="730" width="300" height="100" fill="#FF4F8B" stroke="#232F3E" stroke-width="2" rx="5"/>
    <text x="400" y="760" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Amazon CloudWatch</text>
    <text x="400" y="780" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">(Logs & Monitoring)</text>
    <text x="400" y="805" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Application logs, Metrics, Alarms</text>
  </g>
  
  <!-- Cost box -->
  <g id="cost">
    <rect x="50" y="850" width="700" height="40" fill="#F0F0F0" stroke="#232F3E" stroke-width="1" rx="3"/>
    <text x="400" y="875" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#232F3E">
      Monthly Cost: ~$56 | With Free Tier: ~$10 (first year)
    </text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#232F3E"/>
    </marker>
  </defs>
</svg>