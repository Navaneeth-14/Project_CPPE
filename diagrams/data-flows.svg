<svg viewBox="0 0 900 1100" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="450" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#232F3E">
    CineMatch - Data Flow Diagrams
  </text>
  
  <!-- ============= SIGNUP FLOW ============= -->
  <text x="100" y="70" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FF9900">
    1. User Signup Flow
  </text>
  
  <g id="signup">
    <rect x="100" y="90" width="120" height="60" fill="#FFE0B2" stroke="#FF9900" stroke-width="2" rx="3"/>
    <text x="160" y="115" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">User Browser</text>
    <text x="160" y="133" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">/auth/signup</text>
    
    <line x1="220" y1="120" x2="280" y2="120" stroke="#232F3E" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <rect x="280" y="90" width="120" height="60" fill="#FF9900" stroke="#232F3E" stroke-width="2" rx="3"/>
    <text x="340" y="115" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">FastAPI</text>
    <text x="340" y="133" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">(Auth Lambda)</text>
    
    <line x1="400" y1="120" x2="460" y2="120" stroke="#232F3E" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <rect x="460" y="90" width="120" height="60" fill="#3B48CC" stroke="#232F3E" stroke-width="2" rx="3"/>
    <text x="520" y="115" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">RDS</text>
    <text x="520" y="133" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">INSERT user</text>
    
    <line x1="580" y1="120" x2="640" y2="120" stroke="#232F3E" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <rect x="640" y="90" width="140" height="60" fill="#DD344C" stroke="#232F3E" stroke-width="2" rx="3"/>
    <text x="710" y="115" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Secrets Mgr</text>
    <text x="710" y="133" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Get JWT secret</text>
    
    <!-- Return path -->
    <line x1="710" y1="150" x2="710" y2="170" stroke="#569A31" stroke-width="2"/>
    <line x1="710" y1="170" x2="160" y2="170" stroke="#569A31" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="420" y="165" font-family="Arial, sans-serif" font-size="11" fill="#569A31">← JWT Token</text>
  </g>
  
  <!-- ============= RECOMMENDATION FLOW ============= -->
  <text x="100" y="240" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FF9900">
    2. Personalized Recommendations Flow
  </text>
  
  <g id="recommend">
    <rect x="100" y="260" width="120" height="60" fill="#FFE0B2" stroke="#FF9900" stroke-width="2" rx="3"/>
    <text x="160" y="285" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">User</text>
    <text x="160" y="303" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">(with JWT)</text>
    
    <line x1="220" y1="290" x2="280" y2="290" stroke="#232F3E" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <rect x="280" y="260" width="120" height="60" fill="#FF9900" stroke="#232F3E" stroke-width="2" rx="3"/>
    <text x="340" y="285" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">FastAPI</text>
    <text x="340" y="303" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">/me/recommend</text>
    
    <!-- To RDS -->
    <line x1="340" y1="320" x2="340" y2="380" stroke="#232F3E" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="360" y="355" font-family="Arial, sans-serif" font-size="10" fill="#232F3E">Get genres</text>
    
    <rect x="280" y="380" width="120" height="50" fill="#3B48CC" stroke="#232F3E" stroke-width="2" rx="3"/>
    <text x="340" y="405" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">RDS</text>
    <text x="340" y="420" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">user_genres</text>
    
    <!-- To S3 -->
    <line x1="400" y1="290" x2="500" y2="290" stroke="#232F3E" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="430" y="285" font-family="Arial, sans-serif" font-size="10" fill="#232F3E">Load data</text>
    
    <rect x="500" y="260" width="140" height="70" fill="#569A31" stroke="#232F3E" stroke-width="2" rx="3"/>
    <text x="570" y="285" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">S3</text>
    <text x="570" y="302" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">movies.parquet</text>
    <text x="570" y="316" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">ratings.parquet</text>
    
    <!-- Processing -->
    <rect x="280" y="460" width="180" height="50" fill="#FFF3E0" stroke="#FF9900" stroke-width="2" rx="3"/>
    <text x="370" y="485" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Compute</text>
    <text x="370" y="500" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Hybrid Algorithm</text>
    
    <line x1="340" y1="430" x2="340" y2="460" stroke="#232F3E" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="570" y1="330" x2="570" y2="485" stroke="#232F3E" stroke-width="2"/>
    <line x1="570" y1="485" x2="460" y2="485" stroke="#232F3E" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Return -->
    <line x1="280" y1="485" x2="160" y2="485" stroke="#569A31" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="210" y="480" font-family="Arial, sans-serif" font-size="11" fill="#569A31">← JSON</text>
    
    <!-- CloudWatch -->
    <rect x="500" y="460" width="140" height="50" fill="#FF4F8B" stroke="#232F3E" stroke-width="2" rx="3"/>
    <text x="570" y="482" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">CloudWatch</text>
    <text x="570" y="498" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Log metrics</text>
  </g>
  
  <!-- ============= CHATBOT FLOW ============= -->
  <text x="100" y="570" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FF9900">
    3. Chatbot Conversation Flow
  </text>
  
  <g id="chatbot">
    <rect x="100" y="590" width="120" height="60" fill="#FFE0B2" stroke="#FF9900" stroke-width="2" rx="3"/>
    <text x="160" y="615" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">User</text>
    <text x="160" y="633" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Message</text>
    
    <line x1="220" y1="620" x2="280" y2="620" stroke="#232F3E" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <rect x="280" y="590" width="120" height="60" fill="#FF9900" stroke="#232F3E" stroke-width="2" rx="3"/>
    <text x="340" y="615" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">FastAPI</text>
    <text x="340" y="633" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">/chat</text>
    
    <line x1="400" y1="620" x2="460" y2="620" stroke="#232F3E" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <rect x="460" y="590" width="120" height="60" fill="#569A31" stroke="#232F3E" stroke-width="2" rx="3"/>
    <text x="520" y="615" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">S3</text>
    <text x="520" y="633" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Search movies</text>
    
    <line x1="580" y1="620" x2="640" y2="620" stroke="#232F3E" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <rect x="640" y="590" width="140" height="60" fill="#9C27B0" stroke="#232F3E" stroke-width="2" rx="3"/>
    <text x="710" y="615" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Groq API</text>
    <text x="710" y="633" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">AI Inference</text>
    
    <!-- Return path -->
    <line x1="710" y1="650" x2="710" y2="680" stroke="#569A31" stroke-width="2"/>
    <line x1="710" y1="680" x2="160" y2="680" stroke="#569A31" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="420" y="675" font-family="Arial, sans-serif" font-size="11" fill="#569A31">← AI Response</text>
    
    <!-- CloudWatch -->
    <rect x="280" y="700" width="180" height="40" fill="#FF4F8B" stroke="#232F3E" stroke-width="2" rx="3"/>
    <text x="370" y="723" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">CloudWatch - Log conversation</text>
    
    <line x1="340" y1="650" x2="340" y2="700" stroke="#232F3E" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- ============= MOOD FLOW ============= -->
  <text x="100" y="800" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FF9900">
    4. Mood-Based Recommendations Flow
  </text>
  
  <g id="mood">
    <rect x="100" y="820" width="120" height="60" fill="#FFE0B2" stroke="#FF9900" stroke-width="2" rx="3"/>
    <text x="160" y="845" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">User</text>
    <text x="160" y="863" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Select mood</text>
    
    <line x1="220" y1="850" x2="280" y2="850" stroke="#232F3E" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <rect x="280" y="820" width="140" height="60" fill="#FF9900" stroke="#232F3E" stroke-width="2" rx="3"/>
    <text x="350" y="845" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">FastAPI</text>
    <text x="350" y="863" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">/moods/intense</text>
    
    <line x1="420" y1="850" x2="480" y2="850" stroke="#232F3E" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <rect x="480" y="820" width="120" height="60" fill="#569A31" stroke="#232F3E" stroke-width="2" rx="3"/>
    <text x="540" y="845" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">S3</text>
    <text x="540" y="863" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Load data</text>
    
    <!-- Processing steps -->
    <rect x="220" y="910" width="180" height="50" fill="#FFF3E0" stroke="#FF9900" stroke-width="2" rx="3"/>
    <text x="310" y="930" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">1. Base recommendations</text>
    <text x="310" y="946" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">(Hybrid algorithm)</text>
    
    <line x1="350" y1="880" x2="310" y2="910" stroke="#232F3E" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <rect x="220" y="980" width="180" height="50" fill="#FFF3E0" stroke="#FF9900" stroke-width="2" rx="3"/>
    <text x="310" y="1000" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">2. Apply mood boost</text>
    <text x="310" y="1016" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">(+0.25 to matching genres)</text>
    
    <line x1="310" y1="960" x2="310" y2="980" stroke="#232F3E" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <rect x="440" y="980" width="160" height="50" fill="#FFF3E0" stroke="#FF9900" stroke-width="2" rx="3"/>
    <text x="520" y="1000" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">3. Re-rank & sort</text>
    <text x="520" y="1016" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">(Top N results)</text>
    
    <line x1="400" y1="1005" x2="440" y2="1005" stroke="#232F3E" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Return -->
    <line x1="440" y1="1005" x2="160" y2="1005" stroke="#569A31" stroke-width="2"/>
    <line x1="160" y1="1005" x2="160" y2="880" stroke="#569A31" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="50" y="940" font-family="Arial, sans-serif" font-size="11" fill="#569A31">Results ↑</text>
  </g>
  
  <!-- Legend -->
  <rect x="50" y="1050" width="800" height="40" fill="#F5F5F5" stroke="#232F3E" stroke-width="2" rx="5"/>
  <text x="80" y="1073" font-family="Arial, sans-serif" font-size="12" fill="#232F3E">Legend:</text>
  
  <rect x="150" y="1060" width="20" height="20" fill="#FF9900" stroke="#232F3E" stroke-width="1"/>
  <text x="180" y="1075" font-family="Arial, sans-serif" font-size="11" fill="#232F3E">FastAPI</text>
  
  <rect x="260" y="1060" width="20" height="20" fill="#3B48CC" stroke="#232F3E" stroke-width="1"/>
  <text x="290" y="1075" font-family="Arial, sans-serif" font-size="11" fill="#232F3E">RDS</text>
  
  <rect x="360" y="1060" width="20" height="20" fill="#569A31" stroke="#232F3E" stroke-width="1"/>
  <text x="390" y="1075" font-family="Arial, sans-serif" font-size="11" fill="#232F3E">S3</text>
  
  <rect x="450" y="1060" width="20" height="20" fill="#DD344C" stroke="#232F3E" stroke-width="1"/>
  <text x="480" y="1075" font-family="Arial, sans-serif" font-size="11" fill="#232F3E">Secrets</text>
  
  <rect x="570" y="1060" width="20" height="20" fill="#FF4F8B" stroke="#232F3E" stroke-width="1"/>
  <text x="600" y="1075" font-family="Arial, sans-serif" font-size="11" fill="#232F3E">CloudWatch</text>
  
  <rect x="710" y="1060" width="20" height="20" fill="#9C27B0" stroke="#232F3E" stroke-width="1"/>
  <text x="740" y="1075" font-family="Arial, sans-serif" font-size="11" fill="#232F3E">External API</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#232F3E"/>
    </marker>
  </defs>
</svg>